<h1>{{ post.title }}</h1>

<img src="{{ post.image.url }}" alt="{{ post.title }}" width="500">

<p>{{ post.description }}</p>
<p>Uploaded by {{ post.uploader.username }}</p>

{% if user == post.uploader %}
<p>
    <a href="{% url 'edit_post' post.id %}">Edit</a>
    |
    <a href="{% url 'delete_post' post.id %}">Delete</a>
</p>
{% endif %}

<h3>Tags</h3>
<ul>
    {% for tag in post.tags.all %}
    <a href="{% url 'tag_detail' tag.name %}">{{ tag.name }}</a>
    {% empty %}
    <span>No tags</span>
    {% endfor %}
</ul>

<a href="{% url 'gallery' %}">Back to gallery</a>
