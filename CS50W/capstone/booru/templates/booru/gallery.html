<h1>Capstone Booru</h1>
<form method="get" action="{% url 'search_posts' %}">
    <input type="text" name="q" value="{{ query|default:'' }}" placeholder="Search tags, e.g. cat blue_eyes">
    <button type="submit">Search</button>
</form>
{% if user.is_authenticated %}
<a href="{% url 'upload_post' %}">Upload image</a>
{% else %}
<p><a href="{% url 'login' %}">Log in</a> to upload images.</p>
{% endif %}
<div>
    {% for post in posts %}
    <div>
        <a href="{% url 'post_detail' post.id %}">
            <img src="{{ post.image.url }}" alt="{{ post.title }}" width="200">
        </a>
        <p>{{ post.title }}</p>
    </div>
    {% empty %}
    <p>No images yet.</p>
    {% endfor %}
</div>
