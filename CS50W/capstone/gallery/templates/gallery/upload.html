{% extends "gallery/layout.html" %}

{% block title %}Upload{% endblock %}

{% block body %}

<h2>Upload Image</h2>

<form action="{% url 'upload' %}" method="post" enctype="multipart/form-data">

    {% csrf_token %}
    {{ form.as_p }}

    <input class="btn btn-primary" type="submit" value="Upload">

</form>

{% endblock %}
