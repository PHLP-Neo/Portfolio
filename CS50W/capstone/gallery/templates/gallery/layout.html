{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <title>{% block title %}Capstone Gallery{% endblock %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'gallery/styles.css' %}">
    {% block script %}
    {% endblock %}
</head>

<body>
    <div class="container">
        <h1>
            <a href="{% url 'index' %}">Capstone Gallery</a>
        </h1>

        {% if user.is_authenticated %}
        <p>
            Signed in as <strong>{{ user.username }}</strong>
        </p>
        <a class="btn btn-sm btn-outline-primary" href="{% url 'index' %}">Home</a>
        <a class="btn btn-sm btn-outline-primary" href="{% url 'upload' %}">Upload</a>
        <a class="btn btn-sm btn-outline-primary" href="{% url 'logout' %}">Log Out</a>
        {% else %}
        <a class="btn btn-sm btn-outline-primary" href="{% url 'index' %}">Home</a>
        <a class="btn btn-sm btn-outline-primary" href="{% url 'login' %}">Log In</a>
        <a class="btn btn-sm btn-outline-primary" href="{% url 'register' %}">Register</a>
        {% endif %}

        <hr>

        {% block body %}
        {% endblock %}
    </div>
</body>

</html>
