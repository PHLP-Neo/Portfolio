{% extends "gallery/layout.html" %}

{% block title %}Search{% endblock %}

{% block body %}

<h2>Search: {{ query }}</h2>

<div class="row">
    {% for post in posts %}
        <div class="col-lg-3 col-md-4 col-sm-6 gallery-card">
            <a href="{% url 'post_detail' post.id %}">
                <img src="{{ post.image.url }}" alt="{{ post.title }}" class="gallery-thumb">
            </a>
            <h5>{{ post.title }}</h5>
        </div>
    {% empty %}
        <p>No images yet.</p>
    {% endfor %}
</div>

{% endblock %}
